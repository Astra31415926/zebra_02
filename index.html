<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>TAINA · Scanner</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#06070a;--panel:#0d0f14;--border:#1a1d26;
  --text:#c8ccd8;--muted:#4a4f62;--accent:#4a90d9;
  --ok:#3ec96e;--warn:#e8a840;--err:#e85050;
}
html,body{height:100%;background:var(--bg);color:var(--text);font:12px/1.5 'Courier New',monospace}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100vh;max-width:900px;margin:0 auto}

/* ── TOPBAR ── */
#topbar{
  display:flex;align-items:center;gap:8px;padding:8px 12px;
  border-bottom:1px solid var(--border);flex-wrap:wrap;
}
#logo{font-size:11px;letter-spacing:4px;color:var(--accent);flex-shrink:0}
.sep{width:1px;height:16px;background:var(--border)}
.btn{
  background:var(--panel);border:1px solid var(--border);color:var(--muted);
  padding:5px 12px;cursor:pointer;font:inherit;font-size:11px;letter-spacing:1px;
  transition:border-color .15s,color .15s;flex-shrink:0;
}
.btn:hover{border-color:var(--accent);color:var(--text)}
.btn.active{border-color:var(--ok);color:var(--ok)}
.btn:disabled{opacity:.35;cursor:default}
input[type=file]{display:none}
#cam-status{
  margin-left:auto;font-size:10px;letter-spacing:2px;color:var(--muted);
  display:flex;align-items:center;gap:6px;
}
#cam-dot{
  width:7px;height:7px;border-radius:50%;background:var(--muted);
  transition:background .3s;
}
#cam-dot.live{background:var(--ok);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── MAIN AREA ── */
#main{display:grid;grid-template-columns:1fr 320px;overflow:hidden}
@media(max-width:660px){#main{grid-template-columns:1fr;grid-template-rows:1fr auto}}

/* ── VIEWPORT ── */
#viewport{
  position:relative;background:#000;display:flex;
  align-items:center;justify-content:center;overflow:hidden;
}
#vid{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;display:none;
}
#vid.show{display:block}
#cnv-main{display:block;max-width:100%;max-height:100%;image-rendering:pixelated}
#overlay{
  position:absolute;inset:0;pointer-events:none;
  display:flex;align-items:center;justify-content:center;
}
#scan-ring{
  width:220px;height:220px;border:2px solid rgba(74,144,217,.4);
  border-radius:4px;display:none;position:relative;
}
#scan-ring.show{display:block}
#scan-ring::before,#scan-ring::after{
  content:'';position:absolute;width:20px;height:20px;
  border-color:var(--accent);border-style:solid;
}
#scan-ring::before{top:-2px;left:-2px;border-width:2px 0 0 2px}
#scan-ring::after{bottom:-2px;right:-2px;border-width:0 2px 2px 0}
#progress-bar{
  position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--border);
}
#progress-fill{height:100%;background:var(--accent);width:0%;transition:width .2s}
#frame-counter{
  position:absolute;top:8px;right:8px;font-size:10px;letter-spacing:2px;
  color:rgba(74,144,217,.7);display:none;
}

/* ── SIDEBAR ── */
#sidebar{
  display:flex;flex-direction:column;border-left:1px solid var(--border);overflow:hidden;
}
#tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.tab{
  flex:1;padding:7px;cursor:pointer;font:inherit;font-size:10px;
  letter-spacing:2px;color:var(--muted);background:none;border:none;
  border-right:1px solid var(--border);transition:color .15s,background .15s;
}
.tab:last-child{border-right:none}
.tab.sel{color:var(--accent);background:rgba(74,144,217,.07)}

#pane-log,#pane-rgb,#pane-diag{
  flex:1;overflow-y:auto;padding:8px 10px;display:none;
}
#pane-log.vis,#pane-rgb.vis,#pane-diag.vis{display:block}
#pane-log{line-height:2}

.lh{color:#2a6090;margin-top:4px}.lok{color:var(--ok)}.lw{color:var(--warn)}.le{color:var(--err)}.li{color:var(--muted)}

/* RGB grid */
#rgb-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:4px 0}
.rgb-tile{display:flex;flex-direction:column;gap:3px}
.rgb-tile canvas{width:100%;image-rendering:pixelated;border:1px solid var(--border)}
.rgb-lbl{font-size:9px;letter-spacing:2px;text-align:center;color:#3a5a7a}

/* Diag panel */
#diag-content{line-height:1.9;font-size:11px}
#diag-content .dk{color:var(--accent)}.dk+span{color:var(--muted)}

/* ── STATUS BAR ── */
#statusbar{
  padding:6px 12px;border-top:1px solid var(--border);
  display:flex;align-items:center;gap:10px;flex-shrink:0;
}
#st{font-size:11px;letter-spacing:2px;flex:1}
#result-box{
  font-size:13px;font-weight:700;letter-spacing:1px;
  color:var(--ok);max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
</style>
</head>
<body>
<div id="app">

  <!-- TOPBAR -->
  <div id="topbar">
    <span id="logo">TAINA·SCAN</span>
    <div class="sep"></div>
    <label class="btn" id="fileBtn">▶ Файл<input type="file" id="fin" accept="image/*"></label>
    <button class="btn" id="camBtn">◎ Камера</button>
    <button class="btn" id="stopBtn" style="display:none">■ Стоп</button>
    <div id="cam-status">
      <div id="cam-dot"></div>
      <span id="cam-label">очікування</span>
    </div>
  </div>

  <!-- MAIN -->
  <div id="main">
    <!-- VIEWPORT -->
    <div id="viewport">
      <canvas id="cnv-main"></canvas>
      <video id="vid" autoplay playsinline muted></video>
      <div id="overlay">
        <div id="scan-ring">
          <span id="frame-counter"></span>
        </div>
      </div>
      <div id="progress-bar"><div id="progress-fill"></div></div>
    </div>

    <!-- SIDEBAR -->
    <div id="sidebar">
      <div id="tabs">
        <button class="tab sel" data-pane="log">ЛОГ</button>
        <button class="tab" data-pane="rgb">RGB</button>
        <button class="tab" data-pane="diag">DIAG</button>
      </div>
      <div id="pane-log" class="vis"></div>
      <div id="pane-rgb"><div id="rgb-grid"></div></div>
      <div id="pane-diag"><div id="diag-content"></div></div>
    </div>
  </div>

  <!-- STATUSBAR -->
  <div id="statusbar">
    <span id="st" style="color:var(--muted)">— готово —</span>
    <span id="result-box"></span>
  </div>

</div>

<script>
'use strict';

// ════════════════════════════════════════════════════════
//  LOG
// ════════════════════════════════════════════════════════
const logEl=document.getElementById('pane-log');
const aL=(m,c)=>{const d=document.createElement('div');d.textContent=m;if(c)d.className=c;logEl.appendChild(d);logEl.scrollTop=logEl.scrollHeight};
const Lh=m=>aL('── '+m,'lh'),Lok=m=>aL('✓ '+m,'lok'),Lw=m=>aL('⚠ '+m,'lw'),Le=m=>aL('✗ '+m,'le'),Li=m=>aL(m,'li');
const clrLog=()=>{logEl.innerHTML=''};
const setSt=(t,c)=>{const el=document.getElementById('st');el.textContent=t;el.style.color=c==='ok'?'var(--ok)':c==='err'?'var(--err)':c==='warn'?'var(--warn)':'var(--muted)'};
const setResult=t=>{document.getElementById('result-box').textContent=t||''};

document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('sel'));
    btn.classList.add('sel');
    const p=btn.dataset.pane;
    ['log','rgb','diag'].forEach(n=>document.getElementById('pane-'+n).classList.toggle('vis',n===p));
  });
});

// ════════════════════════════════════════════════════════
//  UTILS
// ════════════════════════════════════════════════════════
function toGray(d,w,h){const g=new Uint8Array(w*h);for(let i=0;i<w*h;i++)g[i]=(77*d[i*4]+150*d[i*4+1]+29*d[i*4+2])>>8;return g}

function getExifOrientation(buf){
  const v=new DataView(buf);
  if(v.getUint16(0)!==0xFFD8)return 1;
  let off=2;
  while(off<v.byteLength-4){
    const m=v.getUint16(off);
    if(m===0xFFE1){
      if(v.getUint32(off+4)!==0x45786966)return 1;
      const le=v.getUint16(off+10)===0x4949;
      const ifd=off+10+v.getUint32(off+14,le);
      const n=v.getUint16(ifd,le);
      for(let i=0;i<n;i++)if(v.getUint16(ifd+2+i*12,le)===0x0112)return v.getUint16(ifd+2+i*12+8,le);
      return 1;
    }
    if((m&0xFF00)!==0xFF00)break;
    off+=2+v.getUint16(off+2);
  }
  return 1;
}

function applyExifRotation(img,orient){
  const w=img.naturalWidth,h=img.naturalHeight,swap=orient>=5&&orient<=8;
  const c=document.createElement('canvas');c.width=swap?h:w;c.height=swap?w:h;
  const ctx=c.getContext('2d');
  const M=[[],[1,0,0,1,0,0],[-1,0,0,1,w,0],[-1,0,0,-1,w,h],[1,0,0,-1,0,h],[0,1,1,0,0,0],[0,1,-1,0,h,0],[0,-1,-1,0,h,w],[0,-1,1,0,0,w]];
  const t=M[orient]||M[1];ctx.transform(t[0],t[1],t[2],t[3],t[4],t[5]);ctx.drawImage(img,0,0);return c;
}

function gaussianBlur(idata,w,h,passes=1){
  const k=[1,2,1],ksum=4;let d=new Float32Array(idata.data);
  for(let p=0;p<passes;p++){
    const tmp=new Float32Array(d.length);
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){for(let c=0;c<3;c++){let s=0;for(let dx=-1;dx<=1;dx++)s+=d[(y*w+Math.max(0,Math.min(w-1,x+dx)))*4+c]*k[dx+1];tmp[(y*w+x)*4+c]=s/ksum;}tmp[(y*w+x)*4+3]=255;}
    const tmp2=new Float32Array(tmp.length);
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){for(let c=0;c<3;c++){let s=0;for(let dy=-1;dy<=1;dy++)s+=tmp[(Math.max(0,Math.min(h-1,y+dy))*w+x)*4+c]*k[dy+1];tmp2[(y*w+x)*4+c]=s/ksum;}tmp2[(y*w+x)*4+3]=255;}
    d=tmp2;
  }
  const out=new ImageData(w,h);for(let i=0;i<d.length;i++)out.data[i]=Math.round(Math.max(0,Math.min(255,d[i])));return out;
}

// ── Sharpen ──
function unsharp(idata,w,h,amount=0.8){
  const bl=gaussianBlur(idata,w,h,1),out=new ImageData(w,h);
  for(let i=0;i<w*h*4;i+=4)for(let c=0;c<3;c++)out.data[i+c]=Math.max(0,Math.min(255,Math.round(idata.data[i+c]+amount*(idata.data[i+c]-bl.data[i+c]))));
  for(let i=3;i<w*h*4;i+=4)out.data[i]=255;
  return out;
}

// ── CLAHE-lite ──
function localContrast(idata,w,h,radius=40){
  const gray=new Uint8Array(w*h);
  for(let i=0;i<w*h;i++)gray[i]=(77*idata.data[i*4]+150*idata.data[i*4+1]+29*idata.data[i*4+2])>>8;
  const ii=new Float32Array(w*h),ii2=new Float32Array(w*h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const v=gray[y*w+x];ii[y*w+x]=v+(x>0?ii[y*w+x-1]:0)+(y>0?ii[(y-1)*w+x]:0)-(x>0&&y>0?ii[(y-1)*w+x-1]:0);ii2[y*w+x]=v*v+(x>0?ii2[y*w+x-1]:0)+(y>0?ii2[(y-1)*w+x]:0)-(x>0&&y>0?ii2[(y-1)*w+x-1]:0);}
  const out=new ImageData(w,h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const x1=Math.max(0,x-radius),x2=Math.min(w-1,x+radius),y1=Math.max(0,y-radius),y2=Math.min(h-1,y+radius);
    const cnt=(x2-x1+1)*(y2-y1+1);
    const sm=ii[y2*w+x2]-(x1?ii[y2*w+x1-1]:0)-(y1?ii[(y1-1)*w+x2]:0)+(x1&&y1?ii[(y1-1)*w+x1-1]:0);
    const sm2=ii2[y2*w+x2]-(x1?ii2[y2*w+x1-1]:0)-(y1?ii2[(y1-1)*w+x2]:0)+(x1&&y1?ii2[(y1-1)*w+x1-1]:0);
    const mean=sm/cnt,std=Math.sqrt(Math.max(0,sm2/cnt-mean*mean)),scale=std>8?60/std:1;
    const i=y*w+x;
    for(let c=0;c<3;c++){const ch=idata.data[i*4+c];out.data[i*4+c]=Math.max(0,Math.min(255,Math.round(128+(ch-mean)*scale)));}
    out.data[i*4+3]=255;
  }
  return out;
}

// ════════════════════════════════════════════════════════
//  PREPROCESSING
// ════════════════════════════════════════════════════════
function preprocess(src,maxSide=1200,log=true){
  if(log)Lh('PREPROCESS');
  let w=src.width||src.naturalWidth,h=src.height||src.naturalHeight;
  const scale=maxSide/Math.max(w,h);
  const nw=scale<1?Math.round(w*scale):w,nh=scale<1?Math.round(h*scale):h;
  const c=document.createElement('canvas');c.width=nw;c.height=nh;
  c.getContext('2d').drawImage(src,0,0,nw,nh);
  const raw=c.getContext('2d').getImageData(0,0,nw,nh);
  if(log)Li('  розмір: '+nw+'×'+nh);
  // Blur → Sharpen → return raw + sharped
  const blurred=gaussianBlur(raw,nw,nh,1);
  const sharped=unsharp(blurred,nw,nh,0.7);
  return{raw:sharped,w:nw,h:nh,canvas:c};
}

// ════════════════════════════════════════════════════════
//  STAGE 1 — ROI CANDIDATE FINDERS
// ════════════════════════════════════════════════════════

// 1a. gradCorners — gradient-based corner detection
function gradCorners(px,IW,IH,G=100){
  const lum=p=>(px[p*4]+px[p*4+1]+px[p*4+2])/3;
  const cw=IW/G,ch=IH/G,gr=new Float64Array(G*G);
  for(let gy=0;gy<G;gy++)for(let gx=0;gx<G;gx++){
    let s=0,c=0;const x0=Math.floor(gx*cw),x1=Math.floor((gx+1)*cw),y0=Math.floor(gy*ch),y1=Math.floor((gy+1)*ch);
    for(let y=y0+1;y<y1-1;y+=2)for(let x=x0+1;x<x1-1;x+=2){const gxv=Math.abs(lum(y*IW+x+1)-lum(y*IW+x-1)),gyv=Math.abs(lum((y+1)*IW+x)-lum((y-1)*IW+x));s+=gxv+gyv;c++;}
    gr[gy*G+gx]=c?s/c:0;
  }
  const mx=Math.max(...gr),thr=mx*0.18;const fg=gr.map(v=>v>=thr?1:0);
  const dil=new Uint8Array(G*G);
  for(let gy=0;gy<G;gy++)for(let gx=0;gx<G;gx++){let any=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const nx=gx+dx,ny=gy+dy;if(nx>=0&&ny>=0&&nx<G&&ny<G&&fg[ny*G+nx])any=1;}dil[gy*G+gx]=any;}
  const lab=new Int32Array(G*G);let cur=0,best=0,bestPts=null;const st=[];
  for(let s=0;s<G*G;s++){
    if(!dil[s]||lab[s])continue;cur++;const pts=[];st.push(s);lab[s]=cur;
    while(st.length){const p=st.pop();pts.push(p);const gx=p%G,gy=(p/G)|0;for(const[nx,ny]of[[gx-1,gy],[gx+1,gy],[gx,gy-1],[gx,gy+1]]){if(nx<0||ny<0||nx>=G||ny>=G)continue;const q=ny*G+nx;if(dil[q]&&!lab[q]){lab[q]=cur;st.push(q);}}}
    if(pts.length>best){best=pts.length;bestPts=pts;}
  }
  if(!bestPts||best<8)return null;
  let TL,TR,BR,BL;
  for(const p of bestPts){const gx=p%G,gy=(p/G)|0;const X=(gx+0.5)*cw,Y=(gy+0.5)*ch;const s=X+Y,d=X-Y;if(!TL||s<TL.s)TL={X,Y,s};if(!BR||s>BR.s)BR={X,Y,s};if(!TR||d>TR.d)TR={X,Y,d};if(!BL||d<BL.d)BL={X,Y,d};}
  const dd=(a,b)=>Math.hypot(a.X-b.X,a.Y-b.Y),side=(dd(TL,TR)+dd(TR,BR)+dd(BR,BL)+dd(BL,TL))/4;
  if(side<40)return null;
  // return as ROI box {x0,y0,w,h}
  const xs=[TL.X,TR.X,BR.X,BL.X],ys=[TL.Y,TR.Y,BR.Y,BL.Y];
  const pad=side*0.08;
  const x0=Math.max(0,Math.min(...xs)-pad),y0=Math.max(0,Math.min(...ys)-pad);
  const x1=Math.min(IW,Math.max(...xs)+pad),y1=Math.min(IH,Math.max(...ys)+pad);
  return{x0:Math.round(x0),y0:Math.round(y0),w:Math.round(x1-x0),h:Math.round(y1-y0),method:'gradCorners',score:side};
}

// 1b. findCodeBox — connected component on coarse grid
function findCodeBox(px,IW,IH){
  const GX=100,GY=Math.max(20,Math.round(100*IH/IW));const cw=IW/GX,ch=IH/GY;
  const avg=new Float64Array(GX*GY*3);
  for(let gy=0;gy<GY;gy++)for(let gx=0;gx<GX;gx++){
    let r=0,g=0,b=0,cnt=0;const x0=Math.floor(gx*cw),x1=Math.floor((gx+1)*cw),y0=Math.floor(gy*ch),y1=Math.floor((gy+1)*ch);
    for(let y=y0;y<y1;y+=2)for(let x=x0;x<x1;x+=2){const p=(y*IW+x)*4;r+=px[p];g+=px[p+1];b+=px[p+2];cnt++;}
    const i=(gy*GX+gx)*3;avg[i]=cnt?r/cnt:0;avg[i+1]=cnt?g/cnt:0;avg[i+2]=cnt?b/cnt:0;
  }
  const edge=[];
  for(let gx=0;gx<GX;gx++){edge.push([gx,0]);edge.push([gx,GY-1]);}
  for(let gy=0;gy<GY;gy++){edge.push([0,gy]);edge.push([GX-1,gy]);}
  const compMed=k=>{const a=edge.map(([gx,gy])=>avg[(gy*GX+gx)*3+k]).sort((x,y)=>x-y);return a[Math.floor(a.length/2)];};
  const bg=[compMed(0),compMed(1),compMed(2)];const fg=new Uint8Array(GX*GY);
  for(let i=0;i<GX*GY;i++){const dr=avg[i*3]-bg[0],dg=avg[i*3+1]-bg[1],db=avg[i*3+2]-bg[2];if(Math.sqrt(dr*dr+dg*dg+db*db)>50)fg[i]=1;}
  const lab=new Int32Array(GX*GY);let cur=0,best=0,bestBox=null;const stack=[];
  for(let s=0;s<GX*GY;s++){
    if(!fg[s]||lab[s])continue;cur++;let cnt=0,minx=GX,miny=GY,maxx=0,maxy=0;
    stack.push(s);lab[s]=cur;
    while(stack.length){const p=stack.pop();const gx=p%GX,gy=(p/GX)|0;cnt++;if(gx<minx)minx=gx;if(gx>maxx)maxx=gx;if(gy<miny)miny=gy;if(gy>maxy)maxy=gy;for(const[nx,ny]of[[gx-1,gy],[gx+1,gy],[gx,gy-1],[gx,gy+1]]){if(nx<0||ny<0||nx>=GX||ny>=GY)continue;const q=ny*GX+nx;if(fg[q]&&!lab[q]){lab[q]=cur;stack.push(q);}}}
    if(cnt>best){best=cnt;bestBox=[minx,miny,maxx,maxy];}
  }
  if(!bestBox)return null;
  const x0=Math.floor(bestBox[0]*cw),y0=Math.floor(bestBox[1]*ch),x1=Math.ceil((bestBox[2]+1)*cw),y1=Math.ceil((bestBox[3]+1)*ch);
  const padX=cw*0.6,padY=ch*0.6;
  const nx0=Math.max(0,Math.floor(x0-padX)),ny0=Math.max(0,Math.floor(y0-padY));
  const nx1=Math.min(IW,Math.ceil(x1+padX)),ny1=Math.min(IH,Math.ceil(y1+padY));
  const w=nx1-nx0,h=ny1-ny0;if(w<50||h<50)return null;
  return{x0:nx0,y0:ny0,w,h,method:'findCodeBox',score:best*10};
}

// 1c. findOrnament — alternating pixel activity
function findOrnament(px,IW,IH){
  const lum=p=>(px[p]+px[p+1]+px[p+2])/3;
  const rowAct=new Array(IH).fill(0),colAct=new Array(IW).fill(0);
  for(let y=0;y<IH;y++){let prev=-1,tr=0;for(let x=0;x<IW;x+=2){const cc=lum((y*IW+x)*4)>127?1:0;if(cc!==prev){tr++;prev=cc;}}rowAct[y]=tr;}
  for(let x=0;x<IW;x++){let prev=-1,tr=0;for(let y=0;y<IH;y+=2){const cc=lum((y*IW+x)*4)>127?1:0;if(cc!==prev){tr++;prev=cc;}}colAct[x]=tr;}
  const maxRow=Math.max(...rowAct),maxCol=Math.max(...colAct);
  const rowThr=Math.max(4,maxRow*0.25),colThr=Math.max(4,maxCol*0.25);
  function longestBlock(act,thr){

function sampleBG(gray,w,h,s=5){

// ── verifyZebra — ТОЧНО v6.2 ──
function verifyZebra(wGray,S,minContrast){
  function scanLine(arr){
    const n=arr.length;let mn=255,mx=0;for(const v of arr){if(v<mn)mn=v;if(v>mx)mx=v;}
    if(mx-mn<minContrast)return null;
    const thr=(mn+mx)>>1,runs=[];let cur=arr[0]>thr?1:0,len=1;
    for(let i=1;i<n;i++){const b=arr[i]>thr?1:0;if(b===cur)len++;else{runs.push({v:cur,len});cur=b;len=1;}}
    runs.push({v:cur,len});
    if(runs.length<3)return null;
    const allLens=runs.map(r=>r.len).sort((a,b)=>a-b),med=allLens[allLens.length>>1];
    if(med<2)return null;
    const valid=runs.filter(r=>r.len>=med*0.4&&r.len<=med*2.4);
    if(valid.length<5)return null;
    let T=valid.length;
    if(T%2===0){if(valid[0].v===1||valid[T-1].v===1)T+=1;else return null;}
    if(T<5)return null;
    return{T,modSize:S/T};
  }
  const probeOffsets=[2,5,10,15,20,30];
  const votes=new Map();let total=0;
  for(const off of probeOffsets){
    if(off>=S/2)continue;
    for(const pos of[off,S-1-off]){
      const row=new Uint8Array(S);for(let x=0;x<S;x++)row[x]=wGray[pos*S+x];
      const rh=scanLine(row);if(rh)votes.set(rh.T,(votes.get(rh.T)||0)+1);total++;
      const col=new Uint8Array(S);for(let y=0;y<S;y++)col[y]=wGray[y*S+pos];
      const rv=scanLine(col);if(rv)votes.set(rv.T,(votes.get(rv.T)||0)+1);total++;
    }
  }
  if(!votes.size)return null;
  const sorted=[...votes.entries()].sort((a,b)=>b[1]-a[1]);
  const vStr=sorted.slice(0,5).map(([t,v])=>`T${t}:${v}`).join(' ');
  const[bestT,bestV]=sorted[0];
  return{T:bestT,modSize:S/bestT,confidence:bestV/total,voteStr:vStr};
}

// ── findFrame v6.2 (within an ImageData) ──
function findFrame(idata,w,h,log=true){
  const gray=toGray(idata.data,w,h);
  const bg=sampleBG(gray,w,h,5);
  if(log)Li('  BG luma: '+bg);
  const tols=[20,30,42,55,70,90];
  let bestCorners=null,bestSpread=0,bestTol=0;
  for(const tol of tols){
    const rm=makeMask(gray,w,h,bg,tol),em=erodeMask(rm,w,h),fgN=em.reduce((s,v)=>s+v,0);
    if(fgN<50){if(log)Li('  tol='+tol+' FG='+fgN+' —');continue;}
    const c=findCorners(em,w,h,15),sp=spreadCorners(c);
    if(log)Li('  tol='+tol+' FG='+fgN+' spread='+Math.round(sp));
    if(sp>bestSpread){bestSpread=sp;bestCorners=c;bestTol=tol;}
  }
  if(log)Li('  → best tol='+bestTol+' spread='+Math.round(bestSpread));

  // variance fallback
  if(!bestCorners||bestSpread<30){
    const topRows=[],leftCols=[];
    for(let y=0;y<h;y++){let sum=0,sum2=0;for(let x=0;x<w;x++){const v=gray[y*w+x];sum+=v;sum2+=v*v;}const avg=sum/w,std=Math.sqrt(sum2/w-avg*avg);if(std>50)topRows.push(y);}
    for(let x=0;x<w;x++){let sum=0,sum2=0;for(let y=0;y<h;y++){const v=gray[y*w+x];sum+=v;sum2+=v*v;}const avg=sum/h,std=Math.sqrt(sum2/h-avg*avg);if(std>50)leftCols.push(x);}
    topRows.sort((a,b)=>a-b);leftCols.sort((a,b)=>a-b);
    if(topRows.length>0&&leftCols.length>0){
      const vc={tl:{x:leftCols[0],y:topRows[0]},tr:{x:leftCols[leftCols.length-1],y:topRows[0]},br:{x:leftCols[leftCols.length-1],y:topRows[topRows.length-1]},bl:{x:leftCols[0],y:topRows[topRows.length-1]}};
      const vsp=spreadCorners(vc);if(log)Li('  variance spread='+Math.round(vsp));
      if(vsp>bestSpread){bestCorners=vc;bestSpread=vsp;}
    }

// ── sampleCircles ──
function sampleCircles(warped,S,T,modSize){
  const d=warped.data,circleR=modSize*0.28,r2=circleR*circleR,cells=[];
  for(let row=1;row<T-1;row++)for(let col=1;col<T-1;col++){
    const cx=col*modSize+modSize/2,cy=row*modSize+modSize/2;
    let sR=0,sG=0,sB=0,cnt=0;
    const x0=Math.max(0,Math.floor(cx-circleR)),x1=Math.min(S-1,Math.ceil(cx+circleR));
    const y0=Math.max(0,Math.floor(cy-circleR)),y1=Math.min(S-1,Math.ceil(cy+circleR));

  if(!isColored){
    if(log)Lh('ДЕКОД МОНО');let best=null;
    for(const m of modes){const v=decodeVoted(gl,n,m,0,confM);if(v.text!==null){const a=agree(gl,fillChannel(v.text,n,m),n);if(log)Lok('['+m+'] "'+v.text+'" agree='+a.toFixed(3));if(!best||a>best.a)best={v,a,m};}else{if(log)Li('  ['+m+'] null');}}
    return best?{type:'МОНО·'+best.m,text:best.v.text,score:best.a}:{type:'МОНО',text:null,score:0};
  }else{
    if(log)Lh('ДЕКОД КОЛІР');const cls=classifyCells(cells,n);if(log)Li('  палітра: '+cls.name);
    const cR=new Float32Array(n*n),cG=new Float32Array(n*n),cB=new Float32Array(n*n);
    cells.forEach((c,i)=>{cR[i]=Math.min(1,Math.abs(c.r-128)/90);cG[i]=Math.min(1,Math.abs(c.g-128)/90);cB[i]=Math.min(1,Math.abs(c.b-128)/90);});
    let best=null;
    for(const m of modes){
      const rMark=markCell(cls.cr,n,m);let vr=decodeVoted(cls.cr,n,m,rMark?1:0,cR);if(rMark&&vr.text===null)vr=decodeVoted(cls.cr,n,m,0,cR);
      const vg=decodeVoted(cls.cg,n,m,0,cG),vb=decodeVoted(cls.cb,n,m,0,cB);
      const nn=[vr.text,vg.text,vb.text].filter(t=>t!==null);
      if(log)Li('  ['+m+'] R:'+(vr.text!=null?'"'+vr.text+'"':'null')+' G:'+(vg.text!=null?'"'+vg.text+'"':'null')+' B:'+(vb.text!=null?'"'+vb.text+'"':'null'));
      if(!nn.length)continue;
      const sc=nn.length*1000+nn.reduce((a,t)=>a+t.length,0);
      if(!best||sc>best.sc)best={vr,vg,vb,nn,sc,m,rMark};
    }
    if(!best)return{type:'КОЛІР·'+cls.name,text:null,score:0};
    const parts=[best.vr.text,best.vg.text,best.vb.text].filter(t=>t!==null);
    const text=best.rMark?(parts.every(t=>t===parts[0])?parts[0]:parts.join('')):parts.join(' · ');
    if(log)Lok('['+best.m+'] "'+text+'"');
    return{type:'КОЛІР·'+best.m,text,score:best.sc/1000};
  }
}

// ════════════════════════════════════════════════════════
//  PIPELINE: process one ImageData through stage2 for one ROI
// ════════════════════════════════════════════════════════
const S_WARP=600;

function processROI(idata,w,h,roi,log=false){
  // Crop to ROI
  const roiData=cropImageData(idata,w,roi);
  const rw=roi.w,rh=roi.h;

  // findFrame inside ROI
  const{corners,spread:sp}=findFrame(roiData,rw,rh,log);
  if(!corners||sp<20)return null;

  // expand corners slightly
  const exp=Math.max(3,sp*0.01);
  const c={
    tl:{x:Math.max(0,corners.tl.x-exp),y:Math.max(0,corners.tl.y-exp)},
    tr:{x:Math.min(rw-1,corners.tr.x+exp),y:Math.max(0,corners.tr.y-exp)},
    br:{x:Math.min(rw-1,corners.br.x+exp),y:Math.min(rh-1,corners.br.y+exp)},
    bl:{x:Math.max(0,corners.bl.x-exp),y:Math.min(rh-1,corners.bl.y+exp)}
  };

  // warp
  const warped=warpPerspective(roiData,rw,rh,c,S_WARP);
  if(!warped)return null;

  // verifyZebra
  const wGray=toGray(warped.data,S_WARP,S_WARP);
  const zebra=verifyZebra(wGray,S_WARP,45);
  if(!zebra)return null;

  // circles
  const circles=sampleCircles(warped,S_WARP,zebra.T,zebra.modSize);

  // decode
  const decoded=decodeCircles(circles,zebra.T,log);

  // Map corners back to original image coordinates
  const origCorners={
    tl:{x:roi.x0+corners.tl.x,y:roi.y0+corners.tl.y},
    tr:{x:roi.x0+corners.tr.x,y:roi.y0+corners.tr.y},
    br:{x:roi.x0+corners.br.x,y:roi.y0+corners.br.y},
    bl:{x:roi.x0+corners.bl.x,y:roi.y0+corners.bl.y}
  };

  return{
    roi,corners:origCorners,spread:sp,
    warped,zebra,circles,decoded,
    confidence:(decoded&&decoded.text!==null)?zebra.confidence*(decoded.score||0.5):zebra.confidence*0.1
  };
}

// ════════════════════════════════════════════════════════
//  FULL SCAN — stage1 → candidates → stage2 for each
// ════════════════════════════════════════════════════════
function fullScan(idata,w,h,log=true){
  const cands=collectCandidates(idata,w,h,log);
  if(log)Lh('ZEBRA STAGE 2');

  let bestResult=null;

  for(const roi of cands){
    if(log)Li('  try ['+roi.method+'] '+roi.x0+','+roi.y0+' '+roi.w+'×'+roi.h);
    // Skip too-small ROIs
    if(roi.w<60||roi.h<60){if(log)Li('  → too small, skip');continue;}
    const result=processROI(idata,w,h,roi,log);
    if(!result){if(log)Li('  → zebra fail');continue;}
    if(log){
      const t=result.zebra.T,d=result.decoded;
      Lok('  → T='+t+' zebra='+result.zebra.confidence.toFixed(2)+' '+(d&&d.text?'"'+d.text+'"':'no decode'));
    }
    if(!bestResult||result.confidence>bestResult.confidence)bestResult=result;
    // Early exit if solid decode
    if(bestResult&&bestResult.decoded&&bestResult.decoded.text&&bestResult.confidence>0.4)break;
  }
  return bestResult;
}

// ════════════════════════════════════════════════════════
//  DRAWING
// ════════════════════════════════════════════════════════
const cnvMain=document.getElementById('cnv-main');

function drawResult(result){
  if(!result)return;
  const{warped,zebra,circles}=result;
  const S=S_WARP,T=zebra.T,modSize=zebra.modSize;
  cnvMain.width=S;cnvMain.height=S;
  const ctx=cnvMain.getContext('2d');
  ctx.putImageData(warped,0,0);

  // Grid
  ctx.strokeStyle='rgba(40,120,200,0.18)';ctx.lineWidth=0.5;
  for(let i=0;i<=T;i++){const p=i*modSize;ctx.beginPath();ctx.moveTo(p,0);ctx.lineTo(p,S);ctx.stroke();ctx.beginPath();ctx.moveTo(0,p);ctx.lineTo(S,p);ctx.stroke();}

  // Zebra frame highlight
  for(let i=0;i<T;i++){
    ctx.fillStyle=(i%2===0)?'rgba(255,80,80,0.18)':'rgba(80,180,255,0.10)';
    ctx.fillRect(i*modSize,0,modSize,modSize);
    ctx.fillRect(i*modSize,S-modSize,modSize,modSize);
    if(i>0&&i<T-1){ctx.fillRect(0,i*modSize,modSize,modSize);ctx.fillRect(S-modSize,i*modSize,modSize,modSize);}
  }

  // Yellow corners
  ctx.fillStyle='rgba(255,220,50,0.55)';
  [[0,0],[S-modSize,0],[S-modSize,S-modSize],[0,S-modSize]].forEach(([x,y])=>ctx.fillRect(x,y,modSize,modSize));

  // Code area border
  ctx.strokeStyle='rgba(80,235,120,0.55)';ctx.lineWidth=1.5;
  ctx.strokeRect(modSize,modSize,(T-2)*modSize,(T-2)*modSize);

  // Circles
  const cr=modSize*0.28;
  ctx.strokeStyle='rgba(255,255,255,0.7)';ctx.lineWidth=Math.max(0.8,modSize*0.06);
  for(let row=1;row<T-1;row++)for(let col=1;col<T-1;col++){ctx.beginPath();ctx.arc(col*modSize+modSize/2,row*modSize+modSize/2,cr,0,Math.PI*2);ctx.stroke();}
}

function buildRGBPanel(result){
  if(!result)return;
  const{warped,zebra,circles}=result;
  const S=S_WARP,T=zebra.T,modSize=zebra.modSize;
  const grid=document.getElementById('rgb-grid');grid.innerHTML='';
  const labels=['Warped','R','G','B'],colors=[[255,50,50],[50,220,50],[50,100,255]];
  const canvases=labels.map(lbl=>{const tile=document.createElement('div');tile.className='rgb-tile';const c=document.createElement('canvas');c.width=S;c.height=S;const l=document.createElement('div');l.className='rgb-lbl';l.textContent=lbl;tile.appendChild(c);tile.appendChild(l);grid.appendChild(tile);return c;});
  canvases[0].getContext('2d').putImageData(warped,0,0);
  for(let ci=0;ci<3;ci++){
    const c=canvases[ci+1],ctx=c.getContext('2d');
    ctx.fillStyle='#080808';ctx.fillRect(0,0,S,S);
    ctx.strokeStyle='rgba(40,40,60,0.5)';ctx.lineWidth=0.5;
    for(let i=0;i<=T;i++){const p=i*modSize;ctx.beginPath();ctx.moveTo(p,0);ctx.lineTo(p,S);ctx.stroke();ctx.beginPath();ctx.moveTo(0,p);ctx.lineTo(S,p);ctx.stroke();}
    const[cr_,cg_,cb_]=colors[ci];
    circles.cells.forEach(cell=>{
      const cx=cell.col*modSize+modSize/2,cy=cell.row*modSize+modSize/2;
      const val=ci===0?cell.r:ci===1?cell.g:cell.b;
      ctx.fillStyle='rgba('+cr_+','+cg_+','+cb_+','+(val/255).toFixed(2)+')';
      ctx.beginPath();ctx.arc(cx,cy,modSize*0.28,0,Math.PI*2);ctx.fill();
      if(modSize>20){ctx.fillStyle='rgba(255,255,255,0.55)';ctx.font=Math.max(6,modSize*0.22)+'px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(Math.round(val),cx,cy);}
    });
  }
}

function updateDiag(result,cands,frameIdx,totalFrames){
  const el=document.getElementById('diag-content');
  if(!result&&!cands){el.innerHTML='';return;}
  let html='';
  if(frameIdx!==undefined)html+=`<div><span class="dk">кадр</span> <span>${frameIdx}/${totalFrames}</span></div>`;
  if(cands){html+=`<div><span class="dk">кандидати</span> <span>${cands.length}</span></div>`;cands.forEach(c=>html+=`<div style="color:var(--muted);font-size:10px"> [${c.method}] ${c.w}×${c.h}</div>`);}
  if(result){
    const z=result.zebra,d=result.decoded;
    html+=`<div><span class="dk">T</span> <span>${z.T}</span></div>`;
    html+=`<div><span class="dk">modSize</span> <span>${z.modSize.toFixed(1)}px</span></div>`;
    html+=`<div><span class="dk">zebra conf</span> <span>${(z.confidence*100).toFixed(0)}%</span></div>`;
    html+=`<div><span class="dk">votes</span> <span style="font-size:10px">${z.voteStr}</span></div>`;
    if(d){html+=`<div><span class="dk">type</span> <span>${d.type}</span></div>`;}
    html+=`<div><span class="dk">roi</span> <span>${result.roi.method}</span></div>`;
  }
  el.innerHTML=html;
}

// ════════════════════════════════════════════════════════
//  CAMERA AUTO-CYCLE
// ════════════════════════════════════════════════════════
let cameraStream=null,cameraTimer=null,cameraRunning=false;
const vid=document.getElementById('vid');
const scanRing=document.getElementById('scan-ring');
const frameCounter=document.getElementById('frame-counter');
const progressFill=document.getElementById('progress-fill');
const camDot=document.getElementById('cam-dot');
const camLabel=document.getElementById('cam-label');

const TOTAL_FRAMES=5,FRAME_INTERVAL=1000;

function setCamUI(state){
  camDot.className='';
  if(state==='live'){camDot.classList.add('live');camLabel.textContent='live';}
  else if(state==='scanning'){camDot.classList.add('live');camLabel.textContent='сканування';}
  else{camLabel.textContent=state;}
}

async function startCamera(){
  try{
    cameraStream=await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ideal:'environment'},
        width:{ideal:1920},height:{ideal:1080}
      }
    });
    vid.srcObject=cameraStream;
    await new Promise(r=>{vid.onloadedmetadata=r});
    await vid.play();
    vid.classList.add('show');
    cnvMain.style.display='none';
    scanRing.classList.add('show');
    frameCounter.style.display='block';
    document.getElementById('camBtn').style.display='none';
    document.getElementById('stopBtn').style.display='inline';
    setCamUI('live');
    setSt('◎ камера запущена…','');
    beginScanCycle();
  }catch(err){
    Le('Камера: '+err.message);setSt('✗ '+err.message,'err');
  }
}

function stopCamera(){
  cameraRunning=false;
  if(cameraTimer){clearTimeout(cameraTimer);cameraTimer=null;}
  if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null;}
  vid.classList.remove('show');
  cnvMain.style.display='block';
  scanRing.classList.remove('show');
  frameCounter.style.display='none';
  progressFill.style.width='0%';
  document.getElementById('camBtn').style.display='inline';
  document.getElementById('stopBtn').style.display='none';
  setCamUI('очікування');
}

function captureFrame(){
  if(!cameraStream||!vid.videoWidth)return null;
  const vw=vid.videoWidth,vh=vid.videoHeight;
  const tmp=document.createElement('canvas');tmp.width=vw;tmp.height=vh;
  tmp.getContext('2d').drawImage(vid,0,0,vw,vh);
  return tmp;
}

function beginScanCycle(){
  cameraRunning=true;
  let frameIdx=0;let bestResult=null;let bestConf=0;

  function doFrame(){
    if(!cameraRunning)return;
    frameIdx++;
    frameCounter.textContent=frameIdx+'/'+TOTAL_FRAMES;
    progressFill.style.width=((frameIdx-1)/TOTAL_FRAMES*100)+'%';
    setCamUI('scanning');
    setSt('⌛ кадр '+frameIdx+'/'+TOTAL_FRAMES+'…','');

    const frameCnv=captureFrame();
    if(!frameCnv){
      scheduleNext();return;
    }

    // Process async so UI doesn't freeze
    setTimeout(()=>{
      try{
        // Draw frame to preview temporarily
        const vw=frameCnv.width,vh=frameCnv.height;
        // preprocess frame
        const maxSide=1200;
        const scale=maxSide/Math.max(vw,vh);
        const nw=scale<1?Math.round(vw*scale):vw,nh=scale<1?Math.round(vh*scale):vh;
        const tmp=document.createElement('canvas');tmp.width=nw;tmp.height=nh;
        tmp.getContext('2d').drawImage(frameCnv,0,0,nw,nh);
        const idata=tmp.getContext('2d').getImageData(0,0,nw,nh);
        // Sharpen
        const bl=gaussianBlur(idata,nw,nh,1);
        const sh=unsharp(bl,nw,nh,0.7);
        // Also try localContrast for monitor scenario
        const lc=localContrast(sh,nw,nh,40);

        const log=frameIdx===1;// only log first frame
        if(log){clrLog();Lh('КАДР '+frameIdx);}

        // Try sharped version
        let result=fullScan(sh,nw,nh,log);

        // If no decode, try local-contrast version
        if(!result||(result&&(!result.decoded||!result.decoded.text))){
          if(log)Lh('→ спроба localContrast');
          const result2=fullScan(lc,nw,nh,false);
          if(result2&&result2.confidence>(result?result.confidence:0))result=result2;
        }

        if(result&&result.confidence>bestConf){
          bestConf=result.confidence;bestResult=result;
          if(log&&result.decoded&&result.decoded.text)Lok('BEST: "'+result.decoded.text+'"');
        }

        updateDiag(result,collectCandidates(sh,nw,nh,false),frameIdx,TOTAL_FRAMES);
        progressFill.style.width=(frameIdx/TOTAL_FRAMES*100)+'%';

        // Early exit on solid result
        if(bestResult&&bestResult.decoded&&bestResult.decoded.text&&bestResult.confidence>0.35){
          finishScan(bestResult);return;
        }

        if(frameIdx>=TOTAL_FRAMES){finishScan(bestResult);return;}
        scheduleNext();
      }catch(err){
        Le('кадр помилка: '+err.message);scheduleNext();
      }
    },20);
  }

  function scheduleNext(){
    if(!cameraRunning)return;
    cameraTimer=setTimeout(doFrame,FRAME_INTERVAL);
  }

  function finishScan(result){
    progressFill.style.width='100%';
    if(result&&result.decoded&&result.decoded.text){
      // Show warped result
      vid.classList.remove('show');
      cnvMain.style.display='block';
      scanRing.classList.remove('show');
      drawResult(result);
      buildRGBPanel(result);
      setSt('✓ TAINA: "'+result.decoded.text+'"','ok');
      setResult('"'+result.decoded.text+'"');
      Lok('═══ РЕЗУЛЬТАТ: "'+result.decoded.text+'" ['+result.decoded.type+'] ═══');
      beep();
    }else if(result){
      setSt('⚠ рамку знайдено, декодування не вдалось','warn');
      setResult('');
      if(result)drawResult(result);
    }else{
      setSt('✗ код не знайдено','err');
      setResult('');
    }
    // Stop camera after result
    cameraRunning=false;
    document.getElementById('stopBtn').click();
  }

  // Start
  cameraTimer=setTimeout(doFrame,500);
}

// ════════════════════════════════════════════════════════
//  FILE PROCESSING
// ════════════════════════════════════════════════════════
function processImageData(idata,w,h){
  clrLog();
  setSt('⌛ обробка…','');setResult('');
  cnvMain.style.display='block';

  // Try sharped
  const bl=gaussianBlur(idata,w,h,1);
  const sh=unsharp(bl,w,h,0.7);

  Lh('STAGE 1 → ROI');
  let result=fullScan(sh,w,h,true);

  // If weak, try localContrast
  if(!result||(result&&(!result.decoded||!result.decoded.text))){
    Lh('→ спроба localContrast');
    const lc=localContrast(sh,w,h,40);
    const result2=fullScan(lc,w,h,false);
    if(result2&&result2.confidence>(result?result.confidence:0))result=result2;
  }

  if(result){
    drawResult(result);
    buildRGBPanel(result);
    updateDiag(result,null);
    if(result.decoded&&result.decoded.text){
      setSt('✓ TAINA: "'+result.decoded.text+'"','ok');
      setResult('"'+result.decoded.text+'"');
      Lok('═══ РЕЗУЛЬТАТ: "'+result.decoded.text+'" ['+result.decoded.type+'] ═══');
    }else{
      setSt('⚠ рамку знайдено, декод не вдався','warn');
      Lw('zebra OK, T='+result.zebra.T+', декод null ['+result.decoded?.type+']');
    }
  }else{
    setSt('✗ код не знайдено','err');
    Le('рамку не виявлено ні в одному кандидаті');
  }
}

function processImage(img,orient){
  let src;
  if(orient&&orient!==1){src=applyExifRotation(img,orient);}
  else{src=document.createElement('canvas');src.width=img.naturalWidth;src.height=img.naturalHeight;src.getContext('2d').drawImage(img,0,0);}
  const maxSide=1200,w=src.width,h=src.height;
  const scale=Math.min(1,maxSide/Math.max(w,h));
  const nw=Math.round(w*scale),nh=Math.round(h*scale);
  const c=document.createElement('canvas');c.width=nw;c.height=nh;
  c.getContext('2d').drawImage(src,0,0,nw,nh);
  const idata=c.getContext('2d').getImageData(0,0,nw,nh);
  processImageData(idata,nw,nh);
}

// ════════════════════════════════════════════════════════
//  SOUND
// ════════════════════════════════════════════════════════
function beep(){
  try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator();const g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(0.08,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.25);o.start();o.stop(ctx.currentTime+0.25);}catch(e){}
}

// ════════════════════════════════════════════════════════
//  EVENT HANDLERS
// ════════════════════════════════════════════════════════
document.getElementById('fin').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  Li('Файл: '+f.name);
  const reader=new FileReader();
  reader.onload=ev=>{
    const orient=getExifOrientation(ev.target.result);
    const img=new Image();
    img.onload=()=>setTimeout(()=>processImage(img,orient),30);
    img.src=URL.createObjectURL(f);
  };
  reader.readAsArrayBuffer(f);
  e.target.value='';
});

document.getElementById('camBtn').addEventListener('click',startCamera);
document.getElementById('stopBtn').addEventListener('click',stopCamera);
</script>
